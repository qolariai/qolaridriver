name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r BACKEND/requirements.txt
      - name: Testes do backend
        working-directory: BACKEND
        run: python -m pytest -q tests

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Portões do MEGA
        run: python tools/spec_check.py

  backoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: BACKOFFICE/package-lock.json
      - name: Instalar e compilar
        working-directory: BACKOFFICE
        run: |
          npm ci
          npm run build

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ["ANDOIRD/DRIVER/RECRIACAO", "ANDOIRD/USER_LITE/RECRIACAO"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Testes unitários
        working-directory: ${{ matrix.module }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
