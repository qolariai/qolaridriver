# Alembic — baseline e migrações do backend Qolari
#
# A URL real vem de BACKEND/config.py (DB_URL) em migrations/env.py; este ficheiro só
# aponta o script location. Uso:
#   .venv\Scripts\alembic upgrade head
#   .venv\Scripts\alembic revision --autogenerate -m "descricao"
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
